{% extends "base.html" %}

{% block content %}

<div class="mb-5">

    <h1>
        📊 Analytics Dashboard
    </h1>

    <p class="text-secondary mb-0">
        Analyze your trading performance.
    </p>

</div>

<div class="row g-4">

    <!-- Win / Loss -->

    <div class="col-lg-6">

        <div class="card analytics-card p-4 h-100">

            <h4 class="mb-4">

                🥧 Win / Loss Ratio

            </h4>

            <div class="chart-container">

                <canvas id="pieChart"></canvas>

            </div>

        </div>

    </div>

    <!-- Strategy -->

    <div class="col-lg-6">

        <div class="card analytics-card p-4 h-100">

            <h4 class="mb-4">

                📊 Strategy Performance

            </h4>

            <div class="chart-container">

                <canvas id="strategyChart"></canvas>

            </div>

        </div>

    </div>
    <!-- Session -->

    <div class="col-lg-6">

        <div class="card analytics-card p-4 h-100">

            <h4 class="mb-4">

                🕒 Session Performance

            </h4>

            <div class="chart-container">

                <canvas id="sessionChart"></canvas>

            </div>

        </div>

    </div>

    <!-- Market -->

    <div class="col-lg-6">

        <div class="card analytics-card p-4 h-100">

            <h4 class="mb-4">

                🌍 Market Distribution

            </h4>

            <div class="chart-container">

                <canvas id="marketChart"></canvas>

            </div>

        </div>

    </div>

    <!-- Emotion -->

    <div class="col-lg-6">

        <div class="card analytics-card p-4 h-100">

            <h4 class="mb-4">

                😊 Emotion Analysis

            </h4>

            <div class="chart-container">

                <canvas id="emotionChart"></canvas>

            </div>

        </div>

    </div>

    <!-- Mistake -->

    <div class="col-lg-6">

        <div class="card analytics-card p-4 h-100">

            <h4 class="mb-4">

                ❌ Mistake Analysis

            </h4>

            <div class="chart-container">

                <canvas id="mistakeChart"></canvas>

            </div>

        </div>

    </div>

</div>

<script>

document.addEventListener("DOMContentLoaded", function () {

    // ============================
    // WIN / LOSS CHART
    // ============================

    const pieCanvas = document.getElementById("pieChart");

    if (pieCanvas) {

        new Chart(pieCanvas, {

            type: "doughnut",

            data: {

                labels: {{ pie_labels | tojson }},

                datasets: [{

                    data: {{ pie_data | tojson }},

                    backgroundColor: [

                        "#22C55E",

                        "#EF4444"

                    ],

                    borderColor: "#1E293B",

                    borderWidth: 3

                }]

            },

            options: {

                responsive: true,

                maintainAspectRatio: false,

                cutout: "70%",

                plugins: {

                    legend: {

                        position: "bottom",

                        labels: {

                            color: "#ffffff",

                            padding: 20,

                            font: {

                                size: 14

                            }

                        }

                    }

                }

            }

        });

    }

    // ============================
    // STRATEGY PERFORMANCE
    // ============================

    const strategyCanvas = document.getElementById("strategyChart");

    if (strategyCanvas) {

        new Chart(strategyCanvas, {

            type: "bar",

            data: {

                labels: {{ strategy_labels | tojson }},

                datasets: [{

                    label: "Win Rate (%)",

                    data: {{ strategy_rates | tojson }},

                    backgroundColor: "#3B82F6",

                    borderRadius: 8,

                    borderSkipped: false

                }]

            },

            options: {

                responsive: true,

                maintainAspectRatio: false,

                indexAxis: "y",

                scales: {

                    x: {

                        beginAtZero: true,

                        max: 100,

                        ticks: {

                            color: "#CBD5E1",

                            callback: function(value) {

                                return value + "%";

                            }

                        },

                        grid: {

                            color: "#334155"

                        }

                    },

                    y: {

                        ticks: {

                            color: "#CBD5E1"

                        },

                        grid: {

                            display: false

                        }

                    }

                },

                plugins: {

                    legend: {

                        display: false

                    },

                    tooltip: {

                        callbacks: {

                            label: function(context) {

                                return context.raw + "% Win Rate";

                            }

                        }

                    }

                }

            }

        });

    }
    // ============================
// SESSION PERFORMANCE
// ============================

const sessionCanvas = document.getElementById("sessionChart");

if (sessionCanvas) {

    new Chart(sessionCanvas, {

        type: "bar",

        data: {

            labels: {{ session_labels | tojson }},

            datasets: [{

                label: "Win Rate (%)",

                data: {{ session_rates | tojson }},

                backgroundColor: "#8B5CF6",

                borderRadius: 8

            }]

        },

        options: {

            responsive: true,

            maintainAspectRatio: false,

            indexAxis: "y",

            plugins: {

                legend: {

                    display: false

                }

            },

            scales: {

                x: {

                    beginAtZero: true,

                    max: 100,

                    ticks: {

                        color: "#CBD5E1",

                        callback: value => value + "%"

                    },

                    grid: {

                        color: "#334155"

                    }

                },

                y: {

                    ticks: {

                        color: "#CBD5E1"

                    },

                    grid: {

                        display: false

                    }

                }

            }

        }

    });

}
const marketCanvas = document.getElementById("marketChart");

if (marketCanvas){

new Chart(marketCanvas,{

type:"pie",

data:{

labels:{{ market_labels|tojson }},

datasets:[{

data:{{ market_counts|tojson }},

backgroundColor:[
"#3B82F6",
"#22C55E",
"#F59E0B",
"#EF4444",
"#8B5CF6"
]

}]

}

});

}
new Chart(document.getElementById("emotionChart"),{

type:"bar",

data:{

labels:{{ emotion_labels|tojson }},

datasets:[{

label: "Losing Trades",
data:{{ emotion_counts|tojson }},

backgroundColor:"#EC4899"

}]

}

});

new Chart(document.getElementById("mistakeChart"),{

type:"bar",

data:{

labels:{{ mistake_labels|tojson }},

datasets:[{
label: "Mistakes",
data:{{ mistake_counts|tojson }},

backgroundColor:"#EF4444"

}]

}

});
    // ============================
    // END OF CHARTS
    // ============================

});

</script>

{% endblock %}

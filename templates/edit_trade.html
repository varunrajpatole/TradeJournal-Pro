{% extends "base.html" %}

{% block content %}

<h2>Edit Trade</h2>

<form method="POST" enctype="multipart/form-data">

    <div class="mb-3">
        <label>Date</label>
        <input
            type="date"
            name="date"
            class="form-control"
            value="{{ trade.date }}"
            required>
    </div>

    <div class="mb-3">
        <label>Symbol</label>
        <input
            type="text"
            name="symbol"
            class="form-control"
            value="{{ trade.symbol }}"
            required>
    </div>

    <div class="mb-3">
        <label>Direction</label>

        <select
            name="direction"
            class="form-control">

            <option value="BUY"
            {% if trade.direction=="BUY" %}selected{% endif %}>
            BUY
            </option>

            <option value="SELL"
            {% if trade.direction=="SELL" %}selected{% endif %}>
            SELL
            </option>

        </select>

    </div>

    <div class="mb-3">
        <label>Entry Price</label>

        <input
            type="number"
            step="0.01"
            name="entry"
            class="form-control"
            value="{{ trade.entry }}"
            required>

    </div>

    <div class="mb-3">
        <label>Exit Price</label>

        <input
            type="number"
            step="0.01"
            name="exit"
            class="form-control"
            value="{{ trade.exit }}"
            required>

    </div>

    <div class="mb-3">
        <label>Lot Size</label>

        <input
            type="number"
            step="0.01"
            name="lot"
            class="form-control"
            value="{{ trade.lot }}"
            required>

    </div>
    <div class="mb-3">

    <label>Market</label>

    <select name="market" class="form-control">

        <option value="Forex" {% if trade.market=="Forex" %}selected{% endif %}>Forex</option>

        <option value="Gold" {% if trade.market=="Gold" %}selected{% endif %}>Gold</option>

        <option value="Crypto" {% if trade.market=="Crypto" %}selected{% endif %}>Crypto</option>

        <option value="Indices" {% if trade.market=="Indices" %}selected{% endif %}>Indices</option>

        <option value="Stocks" {% if trade.market=="Stocks" %}selected{% endif %}>Stocks</option>

    </select>

</div>

    <div class="mb-3">

    <label>Profit / Loss ($)</label>

    <input
        type="number"
        step="0.01"
        name="profit_loss"
        class="form-control"
        value="{{ trade.profit_loss }}">

</div>

    <div class="mb-3">

    <label>Commission ($)</label>

    <input
        type="number"
        step="0.01"
        name="commission"
        class="form-control"
        value="{{ trade.commission }}">

</div>
<div class="mb-3">

    <label>Risk ($)</label>

    <input
        type="number"
        step="0.01"
        name="risk"
        class="form-control"
        value="{{ trade.risk }}">

</div>

    <div class="mb-3">

    <label>Strategy</label>

    <select name="strategy" class="form-control">

        <option value="ICT" {% if trade.strategy=="ICT" %}selected{% endif %}>ICT</option>
        <option value="SMC" {% if trade.strategy=="SMC" %}selected{% endif %}>SMC</option>
        <option value="Breakout" {% if trade.strategy=="Breakout" %}selected{% endif %}>Breakout</option>
        <option value="Scalping" {% if trade.strategy=="Scalping" %}selected{% endif %}>Scalping</option>
        <option value="Swing" {% if trade.strategy=="Swing" %}selected{% endif %}>Swing</option>

    </select>

    </div>

    <div class="mb-3">

    <label>Session</label>

    <select name="session" class="form-control">

        <option value="Asia" {% if trade.session=="Asia" %}selected{% endif %}>Asia</option>
        <option value="London" {% if trade.session=="London" %}selected{% endif %}>London</option>
        <option value="New York" {% if trade.session=="New York" %}selected{% endif %}>New York</option>

    </select>

    </div>

    <div class="mb-3">

    <label>Emotion</label>

    <select name="emotion" class="form-control">

        <option value="Calm" {% if trade.emotion=="Calm" %}selected{% endif %}>Calm</option>
        <option value="Confident" {% if trade.emotion=="Confident" %}selected{% endif %}>Confident</option>
        <option value="Fear" {% if trade.emotion=="Fear" %}selected{% endif %}>Fear</option>
        <option value="FOMO" {% if trade.emotion=="FOMO" %}selected{% endif %}>FOMO</option>
        <option value="Revenge" {% if trade.emotion=="Revenge" %}selected{% endif %}>Revenge</option>
        <option value="Greedy" {% if trade.emotion=="Greedy" %}selected{% endif %}>Greedy</option>

    </select>

    </div>

    <div class="mb-3">

    <label>Mistake</label>

    <select name="mistake" class="form-control">

        <option value="None" {% if trade.mistake=="None" %}selected{% endif %}>None</option>
        <option value="Early Exit" {% if trade.mistake=="Early Exit" %}selected{% endif %}>Early Exit</option>
        <option value="Late Entry" {% if trade.mistake=="Late Entry" %}selected{% endif %}>Late Entry</option>
        <option value="No Stop Loss" {% if trade.mistake=="No Stop Loss" %}selected{% endif %}>No Stop Loss</option>
        <option value="Overtrading" {% if trade.mistake=="Overtrading" %}selected{% endif %}>Overtrading</option>
        <option value="Revenge Trade" {% if trade.mistake=="Revenge Trade" %}selected{% endif %}>Revenge Trade</option>
        <option value="FOMO Entry" {% if trade.mistake=="FOMO Entry" %}selected{% endif %}>FOMO Entry</option>

    </select>

    </div>

    <div class="mb-3">

        <label>Notes</label>

        <textarea
            name="notes"
            class="form-control"
            rows="4">{{ trade.notes }}</textarea>

    </div>

    <div class="mb-3">
    <label>Before Entry Screenshot</label>
    <input
        type="file"
        name="before_image"
        class="form-control"
        accept="image/*">
</div>

<div class="mb-3">
    <label>After Exit Screenshot</label>
    <input
        type="file"
        name="after_image"
        class="form-control"
        accept="image/*">
</div>

    <button class="btn btn-success">

        Update Trade

    </button>

    <a href="/trades"
       class="btn btn-secondary">

        Cancel

    </a>

</form>

{% endblock %}
